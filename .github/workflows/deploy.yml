name: Auto Deploy Backend to Alibaba Cloud

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # 允许在 GitHub 网页上手动点击按钮触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 设置 Java 21 环境 (Setup JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 编译并打包 Java 后端 (Maven Package)
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: 上传 JAR 包到阿里云服务器 (SCP Upload)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "backend/target/backend-0.0.1-SNAPSHOT.jar"
          target: "/opt/myblog/app/"
          strip_components: 2

      - name: 远程重启后端 Docker 容器 (SSH Restart)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            cd /opt/myblog
            docker compose restart backend
