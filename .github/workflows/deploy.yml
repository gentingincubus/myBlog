name: Auto Deploy Backend to Alibaba Cloud

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # 允许在 GitHub 网页上手动点击按钮触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 设置 Java 21 环境 (Setup JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 编译并打包 Java 后端 (Maven Package)
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: 上传 JAR 包到服务器 (SCP Upload JAR)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "backend/target/backend-0.0.1-SNAPSHOT.jar"
          target: "/opt/myblog/app/"
          strip_components: 2

      - name: 同步 Docker Compose 配置到服务器 (SCP Upload Compose)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "deploy/docker-compose.yml"
          target: "/opt/myblog/"
          strip_components: 1

      - name: 自动同步 Secrets 并无缝重启服务 (SSH Auto Deploy)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            cd /opt/myblog

            # 🌟 核心机密注入：自动把 GitHub Secrets 写入服务器私密 .env 文件
            cat <<EOF > .env
            SPRING_DATA_REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            EOF
            chmod 600 .env

            # 带着最新环境变量与新 JAR 包重新加载容器，并强制重启后端使其立即加载最新 JAR
            docker compose up -d
            docker compose restart backend
