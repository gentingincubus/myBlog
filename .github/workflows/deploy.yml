name: Auto Deploy Portal & Admin Frontend to Alibaba Cloud

on:
  push:
    branches:
      - main
      - feature/20260930_转为前端项目
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 安装 Node.js (Setup Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 安装依赖 (Install Dependencies)
        run: pnpm install --frozen-lockfile=false

      - name: 打包构建生产代码 (Build)
        run: pnpm run build

      - name: 上传静态资源到云服务器 (SCP Upload Dist)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "dist/*"
          target: "/var/www/myblog/"
          strip_components: 1
