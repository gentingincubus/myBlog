# ==============================================================================
# 本地开发环境专属配置 (dev)
# ⚠️ 注意：密码凭证均通过 ${...:默认值} 占位符或 application-local.properties 覆盖
# ==============================================================================

# 本地数据库配置 (MySQL 8.0)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/myblog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
# 真实密码由 application-local.properties 自动覆盖，这里仅提供通用占位符
spring.datasource.password=${DB_PASSWORD:123456}

# 本地开发在 IDEA 控制台打印执行的真实 SQL 语句（调试神器）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# 本地 Redis 配置
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:123456}
spring.data.redis.database=0
spring.data.redis.timeout=5000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Cloudflare R2 对象存储配置 (真实密钥由 application-local.properties 覆盖)
r2.bucket-name=myblog-vr
r2.endpoint=https://5923ef4425a92d629e07cbb86b887ba1.r2.cloudflarestorage.com
r2.public-url=https://vr.gentingincubus.com
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}

