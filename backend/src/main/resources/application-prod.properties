# ==============================================================================
# 线上生产环境专属配置 (prod)
# ⚠️ 注意：所有敏感凭证严禁硬编码，全部由服务器操作系统或 Docker 环境变量动态注入！
# ==============================================================================

# 生产数据库连接 (Docker Compose 网络容器名: mysql)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/myblog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# 生产环境关闭详细 SQL 控制台打印（保护磁盘与服务器性能）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl

# 生产 Redis 容器连接 (Docker 容器名: redis)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}
spring.data.redis.database=0
spring.data.redis.timeout=5000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Cloudflare R2 对象存储配置 (由服务器环境变量动态注入)
r2.bucket-name=myblog-vr
r2.endpoint=https://5923ef4425a92d629e07cbb86b887ba1.r2.cloudflarestorage.com
r2.public-url=https://vr.gentingincubus.com
r2.access-key-id=${R2_ACCESS_KEY_ID}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY}

