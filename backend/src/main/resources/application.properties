spring.application.name=backend
server.port=9090

# ===============================
# 数据库连接配置 (MySQL 8.0)
# ===============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/myblog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
# ⚠️ 请把下面这行的 123456 替换成你真实的 MySQL 密码
spring.datasource.password=Genting#89?

# ===============================
# MyBatis-Plus 配置
# ===============================
# 在 IDEA 控制台打印执行的真实 SQL 语句（开发调试神器）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ===============================
# Redis 内存数据库配置 (Docker 容器连接)
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=123456
spring.data.redis.database=0
spring.data.redis.timeout=5000ms
# Lettuce 连接池优化
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0